name: quarkus-gatelink-webpush

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gatelink
      POSTGRES_USER: gatelink
      POSTGRES_PASSWORD: gatelink
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatelink -d gatelink"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gatelink-postgres-data:/var/lib/postgresql

volumes:
  gatelink-postgres-data:
