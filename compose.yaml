name: quarkus-gatelink-webpush

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatelink}
      POSTGRES_USER: ${POSTGRES_USER:-gatelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - gatelink
    security_opt:
      - no-new-privileges:true

  quarkus-gatelink-webpush-server:
    container_name: quarkus-gatelink-webpush-server
    hostname: quarkus-gatelink-webpush-server
    build:
      context: ./quarkus-gatelink-webpush-server
      dockerfile: Dockerfile
    image: quarkus-gatelink-webpush-server:${GATELINK_VERSION:-local}
    restart: unless-stopped
    stop_grace_period: 30s
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_NAME: ${POSTGRES_DB:-gatelink}
      DB_USER: ${POSTGRES_USER:-gatelink}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://id.example.invalid/realms/gatelink}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quarkus-gatelink-webpush-server}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      GATELINK_TLS_COMMON_NAME: ${SERVER_TLS_COMMON_NAME:-quarkus-gatelink-webpush-server}
      GATELINK_TLS_SAN: ${SERVER_TLS_SAN:-DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1}
      GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
    volumes:
      - ./deploy/server/application.properties:/opt/app/config/application.properties:ro
      - ./quarkus-gatelink-webpush-server/runtime/logs:/opt/app/logs
      - ./quarkus-gatelink-webpush-server/runtime/tmp:/opt/app/tmp
      - server_tls:/opt/app/tls
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "--silent", "--show-error", "https://127.0.0.1:8443/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - gatelink
    security_opt:
      - no-new-privileges:true

  quarkus-gatelink-webpush-ui:
    container_name: quarkus-gatelink-webpush-ui
    hostname: quarkus-gatelink-webpush-ui
    build:
      context: ./quarkus-gatelink-webpush-ui
      dockerfile: Dockerfile
    image: quarkus-gatelink-webpush-ui:${GATELINK_VERSION:-local}
    restart: unless-stopped
    depends_on:
      quarkus-gatelink-webpush-server:
        condition: service_healthy
    environment:
      GATELINK_TLS_COMMON_NAME: ${UI_TLS_COMMON_NAME:-quarkus-gatelink-webpush-ui}
      GATELINK_TLS_SAN: ${UI_TLS_SAN:-DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1}
      GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ui_tls:/etc/nginx/tls
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - gatelink
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  server_tls:
  ui_tls:

networks:
  gatelink:
    driver: bridge
