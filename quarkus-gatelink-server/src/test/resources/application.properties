# Explicit test runtime configuration. Keeping this in test resources prevents
# the Java test suite from depending on the packaging profile used for the
# production artifact.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gatelink
quarkus.datasource.password=gatelink
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gatelink

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.jdbc.telemetry=true

# HTTP/security tests use quarkus-test-security rather than an external IdP.
quarkus.oidc.enabled=false

# Keep tests self-contained: create spans but do not export them.
quarkus.otel.exporter.otlp.enabled=false

# Human-readable test output.
quarkus.log.console.json.enabled=false
