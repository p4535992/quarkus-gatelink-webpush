server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Normalize /api to /api/ so it never falls through to Angular routing.
    location = /api {
        return 308 /api/;
    }

    # The trailing slash on proxy_pass is intentional:
    # /api/keys/public -> http://backend:8080/keys/public
    # The matching /api/ prefix is replaced by / before proxying.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Angular must be able to revalidate the service-worker bootstrap and
    # manifest when a new frontend image is deployed.
    location = /ngsw-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /safety-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Angular client-side routes such as /dashboard or /settings must resolve to
    # index.html after a browser refresh. /api/ is handled above first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Angular build artifacts can be cached aggressively. The exact
    # service-worker locations above take precedence over this regex block.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
