quarkus.http.cors.enabled=true

# The standalone browser UI is usually served from another local development origin.
# Production origins must be configured explicitly.
%dev.quarkus.http.cors.origins=/.*/

# PostgreSQL is the durable store for browser PushSubscription records.
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=gatelink
%dev.quarkus.datasource.password=gatelink
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gatelink
%test.quarkus.datasource.username=gatelink
%test.quarkus.datasource.password=gatelink
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gatelink

# Packaged applications run with the prod profile. Production DB settings are mandatory.
%prod.quarkus.datasource.username=${GATELINK_DB_USER}
%prod.quarkus.datasource.password=${GATELINK_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${GATELINK_DB_URL}

# Flyway owns the schema; Hibernate validates that the Java mapping matches it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Trace SQL executions with the Quarkus-managed OpenTelemetry instrumentation.
quarkus.datasource.jdbc.telemetry=true

# OIDC Bearer authentication protects administrative operations.
# In dev mode Quarkus Dev Services starts Keycloak automatically because the
# auth-server URL is intentionally production-only. alice receives the GateLink
# administrator role. Tests use quarkus-test-security without starting Keycloak.
quarkus.keycloak.devservices.roles.alice=gatelink-admin
%test.quarkus.oidc.enabled=false
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${GATELINK_OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${GATELINK_OIDC_CLIENT_ID}

# Generate traces locally/tests but do not attempt to export them to an absent collector.
%dev.quarkus.otel.exporter.otlp.enabled=false
%test.quarkus.otel.exporter.otlp.enabled=false

# Production console logs are structured JSON; keep development and test output human-readable.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
