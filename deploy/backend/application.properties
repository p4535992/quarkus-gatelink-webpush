# Container runtime configuration. Compose mounts this file read-only at
# /opt/app/config/application.properties, which is Quarkus' standard external
# $PWD/config/application.properties location inside the runtime container.
#
# Keeping the source copy outside quarkus-gatelink-server/config is intentional:
# local Maven/dev/test runs must not accidentally load production container
# settings such as the Docker-only hostname `postgres`.

# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors.enabled=false

# PostgreSQL. Compose injects DB_NAME / DB_USER / DB_PASSWORD into the backend.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.telemetry=true

# Flyway owns schema evolution; Hibernate only validates mappings.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# OIDC is external to this three-container stack. Keep it disabled in the
# provided .env.example so the stack can boot by itself. Production deployments
# that use admin endpoints must enable it and provide a real issuer URL.
quarkus.oidc.enabled=${OIDC_ENABLED:false}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://id.example.invalid/realms/gatelink}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:gatelink-server}

# VAPID keys are read directly from WEBPUSH_VAPID_PUBLIC_KEY /
# WEBPUSH_VAPID_PRIVATE_KEY environment variables through MicroProfile Config.
# If both are absent, GateLink intentionally creates a temporary development
# identity. Production must provide a stable pair.
webpush.vapid.subject=${WEBPUSH_VAPID_SUBJECT:mailto:admin@example.com}

# Keep normal container stdout/stderr logging for `docker compose logs`.
quarkus.log.console.enabled=true

# Also persist application logs on the bind-mounted /opt/app/logs directory.
quarkus.log.file.enabled=true
quarkus.log.file.path=/opt/app/logs/application.log
quarkus.log.file.rotation.enabled=true
quarkus.log.file.rotation.max-file-size=50M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd.gz
quarkus.log.file.rotation.rotate-on-boot=true

# Tracing stays enabled, but exporting requires an explicitly configured OTLP
# endpoint in the deployment environment.
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
