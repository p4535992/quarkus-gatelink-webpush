name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_label:
        description: Optional version label for a manual packaging test
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'docker-compose.yml'
      - '.env.example'
      - 'config/**'
      - 'quarkus-gatelink-webpush-server/application.properties'
      - 'quarkus-gatelink-webpush-server/Dockerfile'
      - 'quarkus-gatelink-webpush-server/docker-entrypoint.sh'
      - 'quarkus-gatelink-webpush-server/pom.xml'
      - 'quarkus-gatelink-webpush-ui/Dockerfile'
      - 'quarkus-gatelink-webpush-ui/docker-entrypoint.sh'
      - 'quarkus-gatelink-webpush-ui/angular.json'
      - 'quarkus-gatelink-webpush-ui/package.json'

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: gatelink
          POSTGRES_USER: gatelink
          POSTGRES_PASSWORD: gatelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatelink -d gatelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag='${{ github.event.release.tag_name }}'
          else
            tag='${{ inputs.version_label }}'
            if [[ -z "${tag}" ]]; then
              tag="manual-${GITHUB_SHA::7}"
            fi
          fi

          version="${tag#v}"
          version="${version//\//-}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Verify Quarkus project
        run: mvn -B -f quarkus-gatelink-webpush-server/pom.xml clean verify

      - name: Build Quarkus uber-JAR
        run: >-
          mvn -B -f quarkus-gatelink-webpush-server/pom.xml
          -DskipTests
          -Dquarkus.package.jar.type=uber-jar
          -Dquarkus.package.output-name=quarkus-gatelink-webpush-server
          package

      - name: Build Angular production application
        working-directory: quarkus-gatelink-webpush-ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble release directories
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.meta.outputs.version }}'
          PROJECT_NAME="quarkus-gatelink-webpush"
          OUT="${GITHUB_WORKSPACE}/release-out"
          STAGE="${GITHUB_WORKSPACE}/release-stage"
          SERVER_NAME="${PROJECT_NAME}-server-${VERSION}"
          UI_NAME="${PROJECT_NAME}-ui-${VERSION}"
          COMPOSE_NAME="${PROJECT_NAME}-compose-${VERSION}"
          UI_ARCHIVE_DIR="${STAGE}/${UI_NAME}"
          BUNDLE="${STAGE}/${COMPOSE_NAME}"
          SERVER_DIR="${BUNDLE}/quarkus-gatelink-webpush-server"
          UI_DIR="${BUNDLE}/quarkus-gatelink-webpush-ui"
          DATA_DIR="${BUNDLE}/data/quarkus-gatelink-webpush-server"

          mkdir -p \
            "${OUT}" \
            "${UI_ARCHIVE_DIR}" \
            "${BUNDLE}/config" \
            "${DATA_DIR}/logs" \
            "${DATA_DIR}/tmp" \
            "${SERVER_DIR}" \
            "${UI_DIR}/dist"

          cp quarkus-gatelink-webpush-server/target/quarkus-gatelink-webpush-server-runner.jar \
            "${OUT}/${SERVER_NAME}.jar"
          cp -a quarkus-gatelink-webpush-ui/dist/gatelink-webpush-ui/browser/. "${UI_ARCHIVE_DIR}/"

          cp "${OUT}/${SERVER_NAME}.jar" "${SERVER_DIR}/app.jar"
          cp quarkus-gatelink-webpush-server/application.properties "${SERVER_DIR}/application.properties"
          cp quarkus-gatelink-webpush-server/docker-entrypoint.sh "${SERVER_DIR}/docker-entrypoint.sh"

          cp -a quarkus-gatelink-webpush-ui/dist/gatelink-webpush-ui/browser/. "${UI_DIR}/dist/"
          cp quarkus-gatelink-webpush-ui/docker-entrypoint.sh "${UI_DIR}/docker-entrypoint.sh"
          cp config/nginx.conf "${BUNDLE}/config/nginx.conf"

          sed "s/^GATELINK_VERSION=.*/GATELINK_VERSION=${VERSION}/" .env.example > "${BUNDLE}/.env.example"

          cat > "${SERVER_DIR}/Dockerfile" <<'EOF'
          FROM eclipse-temurin:21-jre-noble

          ARG APP_UID=10001
          ARG APP_GID=10001

          ENV JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=/opt/app/tmp -Djava.util.logging.manager=org.jboss.logmanager.LogManager"

          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl openssl \
              && rm -rf /var/lib/apt/lists/* \
              && groupadd --gid "${APP_GID}" gatelink \
              && useradd --uid "${APP_UID}" --gid "${APP_GID}" --home-dir /opt/app --no-create-home --shell /usr/sbin/nologin gatelink \
              && mkdir -p /opt/app/config /opt/app/logs /opt/app/tmp /opt/app/tls \
              && chown -R "${APP_UID}:${APP_GID}" /opt/app

          WORKDIR /opt/app

          COPY --chown=10001:10001 quarkus-gatelink-webpush-server/app.jar /opt/app/app.jar
          COPY --chown=10001:10001 quarkus-gatelink-webpush-server/docker-entrypoint.sh /opt/app/docker-entrypoint.sh

          EXPOSE 8080 8443

          USER 10001:10001
          ENTRYPOINT ["sh", "/opt/app/docker-entrypoint.sh"]
          EOF

          cat > "${UI_DIR}/Dockerfile" <<'EOF'
          FROM nginx:1.28.3-alpine

          RUN apk add --no-cache openssl \
              && mkdir -p /etc/nginx/tls

          COPY config/nginx.conf /etc/nginx/conf.d/default.conf
          COPY quarkus-gatelink-webpush-ui/docker-entrypoint.sh /usr/local/bin/gatelink-entrypoint.sh
          COPY quarkus-gatelink-webpush-ui/dist/ /usr/share/nginx/html/

          EXPOSE 80 443

          ENTRYPOINT ["/bin/sh", "/usr/local/bin/gatelink-entrypoint.sh"]
          CMD ["nginx", "-g", "daemon off;"]
          EOF

          cat > "${BUNDLE}/docker-compose.yml" <<'EOF'
          name: quarkus-gatelink-webpush

          services:
            postgres:
              image: postgres:18.4
              restart: unless-stopped
              environment:
                POSTGRES_DB: ${POSTGRES_DB:-gatelink}
                POSTGRES_USER: ${POSTGRES_USER:-gatelink}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 10s
              volumes:
                - postgres_data:/var/lib/postgresql
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

            quarkus-gatelink-webpush-server:
              container_name: quarkus-gatelink-webpush-server
              hostname: quarkus-gatelink-webpush-server
              build:
                context: .
                dockerfile: quarkus-gatelink-webpush-server/Dockerfile
              image: quarkus-gatelink-webpush-server:${GATELINK_VERSION:-release}
              restart: unless-stopped
              stop_grace_period: 30s
              user: "10001:10001"
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                DB_NAME: ${POSTGRES_DB:-gatelink}
                DB_USER: ${POSTGRES_USER:-gatelink}
                DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
                OIDC_ENABLED: ${OIDC_ENABLED:-false}
                OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://id.example.invalid/realms/gatelink}
                OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quarkus-gatelink-webpush-server}
                WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
                WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
                WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@example.com}
                OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
                GATELINK_TLS_COMMON_NAME: ${SERVER_TLS_COMMON_NAME:-quarkus-gatelink-webpush-server}
                GATELINK_TLS_SAN: ${SERVER_TLS_SAN:-DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              volumes:
                - ./quarkus-gatelink-webpush-server/application.properties:/opt/app/config/application.properties:ro
                - ./data/quarkus-gatelink-webpush-server/logs:/opt/app/logs
                - ./data/quarkus-gatelink-webpush-server/tmp:/opt/app/tmp
                - server_tls:/opt/app/tls
              ports:
                - "8080:8080"
                - "8443:8443"
              healthcheck:
                test: ["CMD", "curl", "--fail", "--insecure", "--silent", "--show-error", "https://127.0.0.1:8443/q/health/ready"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 20s
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

            quarkus-gatelink-webpush-ui:
              container_name: quarkus-gatelink-webpush-ui
              hostname: quarkus-gatelink-webpush-ui
              build:
                context: .
                dockerfile: quarkus-gatelink-webpush-ui/Dockerfile
              image: quarkus-gatelink-webpush-ui:${GATELINK_VERSION:-release}
              restart: unless-stopped
              depends_on:
                quarkus-gatelink-webpush-server:
                  condition: service_healthy
              environment:
                GATELINK_TLS_COMMON_NAME: ${UI_TLS_COMMON_NAME:-quarkus-gatelink-webpush-ui}
                GATELINK_TLS_SAN: ${UI_TLS_SAN:-DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
                - ui_tls:/etc/nginx/tls
              healthcheck:
                test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
                interval: 10s
                timeout: 3s
                retries: 6
                start_period: 5s
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

          volumes:
            postgres_data:
            server_tls:
            ui_tls:

          networks:
            gatelink:
              driver: bridge
          EOF

          cat > "${BUNDLE}/README.md" <<EOF
          # Quarkus GateLink Web Push ${VERSION}

          Ready-to-run Docker Compose bundle.

          ## Start

          \`\`\`bash
          cp .env.example .env
          sudo chown -R 10001:10001 data/quarkus-gatelink-webpush-server/logs
          sudo chown -R 10001:10001 data/quarkus-gatelink-webpush-server/tmp
          docker compose -f docker-compose.yml up -d --build --wait
          \`\`\`

          Normal user entry point: \`https://localhost/\`.

          Direct Quarkus endpoints remain available at \`http://localhost:8080/\`
          and \`https://localhost:8443/\`.

          Nginx proxy configuration is stored in \`config/nginx.conf\`.
          Quarkus runtime configuration is stored in
          \`quarkus-gatelink-webpush-server/application.properties\`.
          EOF

          sudo chown -R 10001:10001 "${DATA_DIR}/logs" "${DATA_DIR}/tmp"
          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" config --quiet

      - name: Smoke test ready-to-run Compose bundle
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.meta.outputs.version }}'
          BUNDLE="${GITHUB_WORKSPACE}/release-stage/quarkus-gatelink-webpush-compose-${VERSION}"

          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" build \
            quarkus-gatelink-webpush-server quarkus-gatelink-webpush-ui
          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" \
            up -d --no-build --wait --wait-timeout 120

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/)" = "308"
          curl --fail --insecure --silent --show-error https://127.0.0.1/healthz
          curl --fail --insecure --silent --show-error https://127.0.0.1/api/q/health/ready
          curl --fail --insecure --silent --show-error https://127.0.0.1/dashboard | grep -q '<app-root'
          curl --fail --silent --show-error http://127.0.0.1:8080/q/health/ready
          curl --fail --insecure --silent --show-error https://127.0.0.1:8443/q/health/ready

          test "$(docker inspect -f '{{.Name}}' quarkus-gatelink-webpush-server)" = '/quarkus-gatelink-webpush-server'
          test "$(docker inspect -f '{{.Config.Hostname}}' quarkus-gatelink-webpush-server)" = 'quarkus-gatelink-webpush-server'
          test "$(docker inspect -f '{{.Name}}' quarkus-gatelink-webpush-ui)" = '/quarkus-gatelink-webpush-ui'
          test "$(docker inspect -f '{{.Config.Hostname}}' quarkus-gatelink-webpush-ui)" = 'quarkus-gatelink-webpush-ui'

          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" \
            exec -T quarkus-gatelink-webpush-ui getent hosts quarkus-gatelink-webpush-server

          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" \
            exec -T quarkus-gatelink-webpush-server \
            sh -c 'test "$(id -u)" = "10001" && test -w /opt/app/logs && test -w /opt/app/tmp && test -s /opt/app/tls/tls.crt && test -s /opt/app/tls/tls.key'

          docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" \
            exec -T quarkus-gatelink-webpush-ui \
            sh -c 'test -s /etc/nginx/tls/tls.crt && test -s /etc/nginx/tls/tls.key'

          test -f "${BUNDLE}/data/quarkus-gatelink-webpush-server/logs/application.log"

      - name: Print release Compose diagnostics on failure
        if: failure()
        shell: bash
        run: |
          VERSION='${{ steps.meta.outputs.version }}'
          BUNDLE="${GITHUB_WORKSPACE}/release-stage/quarkus-gatelink-webpush-compose-${VERSION}"
          if [[ -f "${BUNDLE}/docker-compose.yml" ]]; then
            docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" ps -a || true
            docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" logs --no-color --tail=300 || true
          fi

      - name: Stop release Compose stack
        if: always()
        shell: bash
        run: |
          VERSION='${{ steps.meta.outputs.version }}'
          BUNDLE="${GITHUB_WORKSPACE}/release-stage/quarkus-gatelink-webpush-compose-${VERSION}"
          if [[ -f "${BUNDLE}/docker-compose.yml" ]]; then
            docker compose --env-file "${BUNDLE}/.env.example" -f "${BUNDLE}/docker-compose.yml" down -v --remove-orphans || true
          fi

      - name: Create ZIP and TAR.GZ archives
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ steps.meta.outputs.version }}'
          PROJECT_NAME="quarkus-gatelink-webpush"
          OUT="${GITHUB_WORKSPACE}/release-out"
          STAGE="${GITHUB_WORKSPACE}/release-stage"
          SERVER_NAME="${PROJECT_NAME}-server-${VERSION}"
          UI_NAME="${PROJECT_NAME}-ui-${VERSION}"
          COMPOSE_NAME="${PROJECT_NAME}-compose-${VERSION}"

          (
            cd "${STAGE}"
            zip -q -r "${OUT}/${UI_NAME}.zip" "${UI_NAME}"
            tar -czf "${OUT}/${UI_NAME}.tar.gz" "${UI_NAME}"
            zip -q -r "${OUT}/${COMPOSE_NAME}.zip" "${COMPOSE_NAME}"
            tar -czf "${OUT}/${COMPOSE_NAME}.tar.gz" "${COMPOSE_NAME}"
          )

          (
            cd "${OUT}"
            sha256sum \
              "${SERVER_NAME}.jar" \
              "${UI_NAME}.zip" \
              "${UI_NAME}.tar.gz" \
              "${COMPOSE_NAME}.zip" \
              "${COMPOSE_NAME}.tar.gz" \
              > SHA256SUMS
          )

          ls -lh "${OUT}"

      - name: Keep artifacts for manual runs and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-gatelink-webpush-release-${{ steps.meta.outputs.version }}
          path: release-out/*
          if-no-files-found: error
          compression-level: 0

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload '${{ steps.meta.outputs.tag }}' release-out/* --clobber

      - name: Release summary
        shell: bash
        run: |
          {
            echo '## Quarkus GateLink Web Push release artifacts'
            echo
            echo 'Version: `${{ steps.meta.outputs.version }}`'
            echo
            echo 'Generated:'
            echo '- `quarkus-gatelink-webpush-server-${{ steps.meta.outputs.version }}.jar`'
            echo '- `quarkus-gatelink-webpush-ui-${{ steps.meta.outputs.version }}.zip`'
            echo '- `quarkus-gatelink-webpush-ui-${{ steps.meta.outputs.version }}.tar.gz`'
            echo '- `quarkus-gatelink-webpush-compose-${{ steps.meta.outputs.version }}.zip`'
            echo '- `quarkus-gatelink-webpush-compose-${{ steps.meta.outputs.version }}.tar.gz`'
            echo '- `SHA256SUMS`'
          } >> "${GITHUB_STEP_SUMMARY}"
