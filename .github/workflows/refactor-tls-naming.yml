name: One-shot TLS and naming refactor

on:
  push:
    branches: [update/tls-and-server-renaming]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: update/tls-and-server-renaming

      - name: Apply non-workflow TLS and naming refactor
        shell: bash
        run: |
          set -euo pipefail

          git mv deploy/release/backend.Dockerfile deploy/release/server.Dockerfile
          git mv deploy/release/frontend.Dockerfile deploy/release/ui.Dockerfile

          python3 <<'PY'
          from pathlib import Path

          replacements = [
              ('quarkus-gatelink-server', 'quarkus-gatelink-webpush-server'),
              ('deploy/backend', 'deploy/server'),
              ('quarkus-gatelink-backend', 'quarkus-gatelink-webpush-server'),
              ('quarkus-gatelink-frontend', 'quarkus-gatelink-webpush-ui'),
          ]
          extensions = {'.md', '.xml', '.properties', '.sh', '.json', '.ts', '.html', '.css', '.conf', '.dockerignore', '.gitignore'}
          explicit = {'.gitignore', '.env.example', 'Dockerfile'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[:2] == ('.github', 'workflows'):
                  continue
              if path.suffix.lower() not in extensions and path.name not in explicit and not path.name.endswith('Dockerfile'):
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
          PY

          cat > quarkus-gatelink-webpush-server/docker-entrypoint.sh <<'SH'
          #!/bin/sh
          set -eu

          TLS_DIR="${GATELINK_TLS_DIR:-/opt/app/tls}"
          CERT_FILE="${TLS_DIR}/tls.crt"
          KEY_FILE="${TLS_DIR}/tls.key"
          COMMON_NAME="${GATELINK_TLS_COMMON_NAME:-quarkus-gatelink-webpush-server}"
          SUBJECT_ALT_NAME="${GATELINK_TLS_SAN:-DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1}"
          DAYS="${GATELINK_TLS_DAYS:-825}"

          mkdir -p "${TLS_DIR}"

          if [ ! -s "${CERT_FILE}" ] || [ ! -s "${KEY_FILE}" ]; then
            echo "Generating self-signed Quarkus TLS certificate for ${COMMON_NAME}"
            rm -f "${CERT_FILE}" "${KEY_FILE}"
            umask 077
            openssl req \
              -x509 \
              -newkey rsa:3072 \
              -nodes \
              -sha256 \
              -days "${DAYS}" \
              -keyout "${KEY_FILE}" \
              -out "${CERT_FILE}" \
              -subj "/CN=${COMMON_NAME}" \
              -addext "subjectAltName=${SUBJECT_ALT_NAME}"
            chmod 600 "${KEY_FILE}"
            chmod 644 "${CERT_FILE}"
          fi

          exec java -jar /opt/app/app.jar
          SH

          cat > quarkus-gatelink-webpush-server/Dockerfile <<'DOCKER'
          FROM maven:3.9.13-eclipse-temurin-21-noble AS build

          WORKDIR /build

          COPY pom.xml ./
          RUN mvn -B -DskipTests dependency:go-offline

          COPY src ./src
          RUN mvn -B -DskipTests \
              -Dquarkus.package.jar.type=uber-jar \
              -Dquarkus.package.output-name=app \
              package

          FROM eclipse-temurin:21-jre-noble

          ARG APP_UID=10001
          ARG APP_GID=10001

          ENV JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=/opt/app/tmp -Djava.util.logging.manager=org.jboss.logmanager.LogManager"

          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl openssl \
              && rm -rf /var/lib/apt/lists/* \
              && groupadd --gid "${APP_GID}" gatelink \
              && useradd --uid "${APP_UID}" --gid "${APP_GID}" --home-dir /opt/app --no-create-home --shell /usr/sbin/nologin gatelink \
              && mkdir -p /opt/app/config /opt/app/logs /opt/app/tmp /opt/app/tls \
              && chown -R "${APP_UID}:${APP_GID}" /opt/app

          WORKDIR /opt/app

          COPY --from=build --chown=${APP_UID}:${APP_GID} /build/target/app-runner.jar /opt/app/app.jar
          COPY --chown=${APP_UID}:${APP_GID} docker-entrypoint.sh /opt/app/docker-entrypoint.sh

          EXPOSE 8080 8443

          USER ${APP_UID}:${APP_GID}

          ENTRYPOINT ["sh", "/opt/app/docker-entrypoint.sh"]
          DOCKER

          cat > deploy/server/application.properties <<'PROPS'
          # Container runtime configuration. Compose mounts this file read-only at
          # /opt/app/config/application.properties.

          quarkus.application.name=quarkus-gatelink-webpush-server

          # Keep both of the standard GateLink server entry points available.
          quarkus.http.host=0.0.0.0
          quarkus.http.port=8080
          quarkus.http.ssl-port=8443
          quarkus.http.insecure-requests=enabled
          quarkus.tls.key-store.pem.0.cert=/opt/app/tls/tls.crt
          quarkus.tls.key-store.pem.0.key=/opt/app/tls/tls.key
          quarkus.http.cors.enabled=false

          quarkus.datasource.db-kind=postgresql
          quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${DB_NAME}
          quarkus.datasource.username=${DB_USER}
          quarkus.datasource.password=${DB_PASSWORD}
          quarkus.datasource.jdbc.telemetry=true

          quarkus.flyway.migrate-at-start=true
          quarkus.hibernate-orm.schema-management.strategy=validate

          quarkus.oidc.enabled=${OIDC_ENABLED:false}
          quarkus.oidc.application-type=service
          quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://id.example.invalid/realms/gatelink}
          quarkus.oidc.client-id=${OIDC_CLIENT_ID:gatelink-server}

          webpush.vapid.subject=${WEBPUSH_VAPID_SUBJECT:mailto:admin@example.com}

          quarkus.log.console.enabled=true
          quarkus.log.file.enabled=true
          quarkus.log.file.path=/opt/app/logs/application.log
          quarkus.log.file.rotation.enabled=true
          quarkus.log.file.rotation.max-file-size=50M
          quarkus.log.file.rotation.max-backup-index=10
          quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd.gz
          quarkus.log.file.rotation.rotate-on-boot=true

          quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
          PROPS

          cat > quarkus-gatelink-webpush-ui/docker-entrypoint.sh <<'SH'
          #!/bin/sh
          set -eu

          TLS_DIR="${GATELINK_TLS_DIR:-/etc/nginx/tls}"
          CERT_FILE="${TLS_DIR}/tls.crt"
          KEY_FILE="${TLS_DIR}/tls.key"
          COMMON_NAME="${GATELINK_TLS_COMMON_NAME:-quarkus-gatelink-webpush-ui}"
          SUBJECT_ALT_NAME="${GATELINK_TLS_SAN:-DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1}"
          DAYS="${GATELINK_TLS_DAYS:-825}"

          mkdir -p "${TLS_DIR}"

          if [ ! -s "${CERT_FILE}" ] || [ ! -s "${KEY_FILE}" ]; then
            echo "Generating self-signed Nginx TLS certificate for ${COMMON_NAME}"
            rm -f "${CERT_FILE}" "${KEY_FILE}"
            umask 077
            openssl req \
              -x509 \
              -newkey rsa:3072 \
              -nodes \
              -sha256 \
              -days "${DAYS}" \
              -keyout "${KEY_FILE}" \
              -out "${CERT_FILE}" \
              -subj "/CN=${COMMON_NAME}" \
              -addext "subjectAltName=${SUBJECT_ALT_NAME}"
            chmod 600 "${KEY_FILE}"
            chmod 644 "${CERT_FILE}"
          fi

          exec /docker-entrypoint.sh "$@"
          SH

          cat > quarkus-gatelink-webpush-ui/Dockerfile <<'DOCKER'
          FROM node:24.18.0-bookworm-slim AS build

          WORKDIR /workspace

          COPY package.json ./
          RUN npm install --no-audit --no-fund

          COPY angular.json tsconfig.json tsconfig.app.json ngsw-config.json ./
          COPY src ./src

          RUN npm run build

          FROM nginx:1.28.3-alpine

          RUN apk add --no-cache openssl \
              && mkdir -p /etc/nginx/tls

          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY docker-entrypoint.sh /usr/local/bin/gatelink-entrypoint.sh
          COPY --from=build /workspace/dist/gatelink-webpush-ui/browser/ /usr/share/nginx/html/

          EXPOSE 80 443

          ENTRYPOINT ["/bin/sh", "/usr/local/bin/gatelink-entrypoint.sh"]
          CMD ["nginx", "-g", "daemon off;"]
          DOCKER

          cat > quarkus-gatelink-webpush-ui/nginx.conf <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name _;

              location = /healthz {
                  access_log off;
                  default_type text/plain;
                  return 200 "ok\n";
              }

              location / {
                  return 308 https://$host$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name _;

              ssl_certificate /etc/nginx/tls/tls.crt;
              ssl_certificate_key /etc/nginx/tls/tls.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;
              ssl_session_tickets off;

              root /usr/share/nginx/html;
              index index.html;
              client_max_body_size 64k;

              location = /healthz {
                  access_log off;
                  default_type text/plain;
                  return 200 "ok\n";
              }

              location = /api {
                  return 308 /api/;
              }

              location /api/ {
                  proxy_pass https://quarkus-gatelink-webpush-server:8443/;
                  proxy_http_version 1.1;
                  proxy_ssl_server_name on;
                  proxy_ssl_name quarkus-gatelink-webpush-server;
                  proxy_ssl_verify off;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Port 443;

                  proxy_connect_timeout 10s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 300s;
              }

              location = /ngsw-worker.js {
                  try_files $uri =404;
                  add_header Cache-Control "no-cache";
              }

              location = /ngsw.json {
                  try_files $uri =404;
                  add_header Cache-Control "no-cache";
              }

              location = /safety-worker.js {
                  try_files $uri =404;
                  add_header Cache-Control "no-cache";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
                  try_files $uri =404;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          NGINX

          cat > compose.yaml <<'YAML'
          name: quarkus-gatelink-webpush

          services:
            postgres:
              image: postgres:18.4
              restart: unless-stopped
              environment:
                POSTGRES_DB: ${POSTGRES_DB:-gatelink}
                POSTGRES_USER: ${POSTGRES_USER:-gatelink}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 10s
              volumes:
                - postgres_data:/var/lib/postgresql
              networks:
                - gatelink
              security_opt:
                - no-new-privileges:true

            quarkus-gatelink-webpush-server:
              container_name: quarkus-gatelink-webpush-server
              hostname: quarkus-gatelink-webpush-server
              build:
                context: ./quarkus-gatelink-webpush-server
                dockerfile: Dockerfile
              image: quarkus-gatelink-webpush-server:${GATELINK_VERSION:-local}
              restart: unless-stopped
              stop_grace_period: 30s
              user: "10001:10001"
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                DB_NAME: ${POSTGRES_DB:-gatelink}
                DB_USER: ${POSTGRES_USER:-gatelink}
                DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
                OIDC_ENABLED: ${OIDC_ENABLED:-false}
                OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://id.example.invalid/realms/gatelink}
                OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-gatelink-server}
                WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
                WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
                WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@example.com}
                OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
                GATELINK_TLS_COMMON_NAME: ${SERVER_TLS_COMMON_NAME:-quarkus-gatelink-webpush-server}
                GATELINK_TLS_SAN: ${SERVER_TLS_SAN:-DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              volumes:
                - ./deploy/server/application.properties:/opt/app/config/application.properties:ro
                - ./quarkus-gatelink-webpush-server/runtime/logs:/opt/app/logs
                - ./quarkus-gatelink-webpush-server/runtime/tmp:/opt/app/tmp
                - server_tls:/opt/app/tls
              ports:
                - "8080:8080"
                - "8443:8443"
              healthcheck:
                test: ["CMD", "curl", "--fail", "--insecure", "--silent", "--show-error", "https://127.0.0.1:8443/q/health/ready"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 20s
              networks:
                - gatelink
              security_opt:
                - no-new-privileges:true

            quarkus-gatelink-webpush-ui:
              container_name: quarkus-gatelink-webpush-ui
              hostname: quarkus-gatelink-webpush-ui
              build:
                context: ./quarkus-gatelink-webpush-ui
                dockerfile: Dockerfile
              image: quarkus-gatelink-webpush-ui:${GATELINK_VERSION:-local}
              restart: unless-stopped
              depends_on:
                quarkus-gatelink-webpush-server:
                  condition: service_healthy
              environment:
                GATELINK_TLS_COMMON_NAME: ${UI_TLS_COMMON_NAME:-quarkus-gatelink-webpush-ui}
                GATELINK_TLS_SAN: ${UI_TLS_SAN:-DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ui_tls:/etc/nginx/tls
              healthcheck:
                test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
                interval: 10s
                timeout: 3s
                retries: 6
                start_period: 5s
              networks:
                - gatelink
              security_opt:
                - no-new-privileges:true

          volumes:
            postgres_data:
            server_tls:
            ui_tls:

          networks:
            gatelink:
              driver: bridge
          YAML

          cat > .env.example <<'ENV'
          # Copy to .env and change production secrets before deployment.
          GATELINK_VERSION=local

          POSTGRES_DB=gatelink
          POSTGRES_USER=gatelink
          POSTGRES_PASSWORD=change-me-before-production

          OIDC_ENABLED=false
          OIDC_AUTH_SERVER_URL=https://id.example.invalid/realms/gatelink
          OIDC_CLIENT_ID=gatelink-server

          WEBPUSH_VAPID_PUBLIC_KEY=
          WEBPUSH_VAPID_PRIVATE_KEY=
          WEBPUSH_VAPID_SUBJECT=mailto:admin@example.com

          OTEL_EXPORT_ENABLED=false

          # Add the host DNS name/IP used by clients before the first start when
          # it differs from localhost. Certificates persist in named volumes.
          TLS_DAYS=825
          UI_TLS_COMMON_NAME=quarkus-gatelink-webpush-ui
          UI_TLS_SAN=DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1
          SERVER_TLS_COMMON_NAME=quarkus-gatelink-webpush-server
          SERVER_TLS_SAN=DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1
          ENV

          cat > deploy/release/server.Dockerfile <<'DOCKER'
          FROM eclipse-temurin:21-jre-noble

          ARG APP_UID=10001
          ARG APP_GID=10001

          ENV JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=/opt/app/tmp -Djava.util.logging.manager=org.jboss.logmanager.LogManager"

          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl openssl \
              && rm -rf /var/lib/apt/lists/* \
              && groupadd --gid "${APP_GID}" gatelink \
              && useradd --uid "${APP_UID}" --gid "${APP_GID}" --home-dir /opt/app --no-create-home --shell /usr/sbin/nologin gatelink \
              && mkdir -p /opt/app/config /opt/app/logs /opt/app/tmp /opt/app/tls \
              && chown -R "${APP_UID}:${APP_GID}" /opt/app

          WORKDIR /opt/app
          COPY --chown=${APP_UID}:${APP_GID} app.jar /opt/app/app.jar
          COPY --chown=${APP_UID}:${APP_GID} docker-entrypoint.sh /opt/app/docker-entrypoint.sh

          EXPOSE 8080 8443
          USER ${APP_UID}:${APP_GID}
          ENTRYPOINT ["sh", "/opt/app/docker-entrypoint.sh"]
          DOCKER

          cat > deploy/release/ui.Dockerfile <<'DOCKER'
          FROM nginx:1.28.3-alpine

          RUN apk add --no-cache openssl \
              && mkdir -p /etc/nginx/tls

          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY docker-entrypoint.sh /usr/local/bin/gatelink-entrypoint.sh
          COPY dist/ /usr/share/nginx/html/

          EXPOSE 80 443
          ENTRYPOINT ["/bin/sh", "/usr/local/bin/gatelink-entrypoint.sh"]
          CMD ["nginx", "-g", "daemon off;"]
          DOCKER

          cat > deploy/release/compose.yaml <<'YAML'
          name: quarkus-gatelink-webpush

          services:
            postgres:
              image: postgres:18.4
              restart: unless-stopped
              environment:
                POSTGRES_DB: ${POSTGRES_DB:-gatelink}
                POSTGRES_USER: ${POSTGRES_USER:-gatelink}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 10s
              volumes:
                - postgres_data:/var/lib/postgresql
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

            quarkus-gatelink-webpush-server:
              container_name: quarkus-gatelink-webpush-server
              hostname: quarkus-gatelink-webpush-server
              build:
                context: ./server
                dockerfile: Dockerfile
              image: quarkus-gatelink-webpush-server:${GATELINK_VERSION:-release}
              restart: unless-stopped
              stop_grace_period: 30s
              user: "10001:10001"
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                DB_NAME: ${POSTGRES_DB:-gatelink}
                DB_USER: ${POSTGRES_USER:-gatelink}
                DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
                OIDC_ENABLED: ${OIDC_ENABLED:-false}
                OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://id.example.invalid/realms/gatelink}
                OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-gatelink-server}
                WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
                WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
                WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@example.com}
                OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
                GATELINK_TLS_COMMON_NAME: ${SERVER_TLS_COMMON_NAME:-quarkus-gatelink-webpush-server}
                GATELINK_TLS_SAN: ${SERVER_TLS_SAN:-DNS:quarkus-gatelink-webpush-server,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              volumes:
                - ./server/application.properties:/opt/app/config/application.properties:ro
                - server_logs:/opt/app/logs
                - server_tmp:/opt/app/tmp
                - server_tls:/opt/app/tls
              ports:
                - "8080:8080"
                - "8443:8443"
              healthcheck:
                test: ["CMD", "curl", "--fail", "--insecure", "--silent", "--show-error", "https://127.0.0.1:8443/q/health/ready"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 20s
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

            quarkus-gatelink-webpush-ui:
              container_name: quarkus-gatelink-webpush-ui
              hostname: quarkus-gatelink-webpush-ui
              build:
                context: ./ui
                dockerfile: Dockerfile
              image: quarkus-gatelink-webpush-ui:${GATELINK_VERSION:-release}
              restart: unless-stopped
              depends_on:
                quarkus-gatelink-webpush-server:
                  condition: service_healthy
              environment:
                GATELINK_TLS_COMMON_NAME: ${UI_TLS_COMMON_NAME:-quarkus-gatelink-webpush-ui}
                GATELINK_TLS_SAN: ${UI_TLS_SAN:-DNS:quarkus-gatelink-webpush-ui,DNS:localhost,IP:127.0.0.1}
                GATELINK_TLS_DAYS: ${TLS_DAYS:-825}
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ui_tls:/etc/nginx/tls
              healthcheck:
                test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
                interval: 10s
                timeout: 3s
                retries: 6
                start_period: 5s
              networks: [gatelink]
              security_opt: [no-new-privileges:true]

          volumes:
            postgres_data:
            server_logs:
            server_tmp:
            server_tls:
            ui_tls:

          networks:
            gatelink:
              driver: bridge
          YAML

          cat > deploy/release/README.md <<'MD'
          # GateLink @VERSION@ - Docker Compose bundle

          This archive contains the prebuilt Quarkus server and Angular UI. Maven and Node.js are not required on the target host.

          ## Runtime contract

          ```text
          Browser/operator
                |
                | HTTPS 443 (normal user entry)
                v
          quarkus-gatelink-webpush-ui
                |
                | HTTPS 8443, Docker DNS
                v
          quarkus-gatelink-webpush-server
                |
                v
          postgres
          ```

          Fixed service/container/hostname values are `quarkus-gatelink-webpush-ui` and `quarkus-gatelink-webpush-server`.

          Published ports:

          - UI HTTP `80` redirects to HTTPS;
          - UI HTTPS `443` is the normal user entry point;
          - Quarkus HTTP `8080` remains available for direct REST/operations access;
          - Quarkus HTTPS `8443` remains available for direct REST/operations access.

          ## Start

          ```bash
          cp .env.example .env
          # edit secrets and TLS SAN values if the host is not localhost
          docker compose up -d --build --wait
          ```

          Self-signed certificates are generated automatically on first start and persisted in Docker volumes. Browsers/clients must explicitly trust or accept them.

          Verify:

          ```bash
          curl -k https://127.0.0.1/healthz
          curl -k https://127.0.0.1/api/q/health/ready
          curl http://127.0.0.1:8080/q/health/ready
          curl -k https://127.0.0.1:8443/q/health/ready
          docker compose ps
          ```

