          from pathlib import Path

          additions = {
              Path('README.md'): r'''

          ## HTTPS, container names and direct API ports

          The normal user entry point is **HTTPS 443** on `quarkus-gatelink-webpush-ui`. HTTP 80 exists only to redirect to HTTPS. Nginx proxies `/api/` over the private Docker network to:

          ```text
          https://quarkus-gatelink-webpush-server:8443/
          ```

          Quarkus intentionally exposes both direct server ports:

          ```text
          http://localhost:8080
          https://localhost:8443
          ```

          The fixed Docker service/container/hostname identities are:

          ```text
          quarkus-gatelink-webpush-ui
          quarkus-gatelink-webpush-server
          ```

          On first start each container creates its own self-signed certificate and persists it in a Docker volume. Configure `UI_TLS_SAN` and `SERVER_TLS_SAN` in `.env` before the first start when clients use a machine hostname or IP other than `localhost`. Self-signed certificates must be explicitly trusted/accepted by the client.
          ''',
              Path('docs/docker-deployment.md'): r'''

          ## TLS and fixed Docker identities

          GateLink uses these fixed service/container/hostname values:

          ```text
          quarkus-gatelink-webpush-ui
          quarkus-gatelink-webpush-server
          ```

          The normal browser path is:

          ```text
          Browser
             |
             | HTTPS :443
             v
          quarkus-gatelink-webpush-ui
             |
             | HTTPS :8443 via Docker DNS hostname
             v
          quarkus-gatelink-webpush-server
          ```

          HTTP `:80` on the UI only redirects to HTTPS. Quarkus deliberately keeps both `:8080` HTTP and `:8443` HTTPS published for direct REST/operations access.

          Both containers generate a persistent self-signed PEM certificate/key pair on first start. No private TLS key is committed to Git. Defaults include the container DNS name, `localhost`, and `127.0.0.1`. Before first start, extend `UI_TLS_SAN` / `SERVER_TLS_SAN` in `.env` if operators access the host using another DNS name or IP.

          Because the Quarkus certificate is self-signed, Nginx encrypts the internal `/api/` hop but uses `proxy_ssl_verify off`. A deployment with an internal CA should replace this with CA verification.

          Example checks:

          ```bash
          curl -k https://localhost/healthz
          curl -k https://localhost/api/q/health/ready
          curl http://localhost:8080/q/health/ready
          curl -k https://localhost:8443/q/health/ready
          ```

          Do not enable HSTS while operators are still using an untrusted self-signed UI certificate.
          ''',
              Path('docs/operator-guide.md'): r'''

          ## Operator network entry points

          Normal users enter GateLink only through `https://<host>/` on port `443` served by `quarkus-gatelink-webpush-ui`. Port `80` redirects to HTTPS. The UI reaches Quarkus internally as `https://quarkus-gatelink-webpush-server:8443/`; it never uses `localhost` for container-to-container traffic.

          Direct Quarkus access is additionally available for operators on HTTP `8080` and HTTPS `8443`. The HTTPS endpoints use automatically generated self-signed certificates unless the deployment replaces them with its own PKI material.
          ''',
              Path('quarkus-gatelink-webpush-server/README.md'): r'''

          ## Container HTTP/HTTPS contract

          The server container/service/hostname is always `quarkus-gatelink-webpush-server`. It listens on HTTP `8080` and HTTPS `8443` simultaneously. The container entrypoint creates `/opt/app/tls/tls.crt` and `/opt/app/tls/tls.key` on first start when they are absent.

          Normal browser/API traffic coming from the Angular UI arrives through Nginx over `https://quarkus-gatelink-webpush-server:8443/`. Direct operator calls may use `http://localhost:8080` or `https://localhost:8443`.
          ''',
              Path('quarkus-gatelink-webpush-ui/README.md'): r'''

          ## HTTPS runtime

          The UI service/container/hostname is always `quarkus-gatelink-webpush-ui`. Nginx listens on `443` for normal user traffic and keeps port `80` only for HTTP-to-HTTPS redirect plus the local health check. A self-signed certificate is generated on first container start and persisted at `/etc/nginx/tls`.

          `/api/` is proxied to `https://quarkus-gatelink-webpush-server:8443/` using Docker DNS; the browser never needs the internal server hostname.
          ''',
