          ```

          Self-signed certificates are created automatically on first start and persisted in Docker volumes. Browsers will not trust them until the certificate is explicitly accepted/imported.

          Verify:

          ```bash
          curl -k https://127.0.0.1/healthz
          curl -k https://127.0.0.1/api/q/health/ready
          curl http://127.0.0.1:8080/q/health/ready
          curl -k https://127.0.0.1:8443/q/health/ready
          docker compose ps
          ```

          The Nginx `/api/` proxy uses `https://quarkus-gatelink-webpush-server:8443/` on the private Compose network.

          Stop without deleting persistent data:

          ```bash
          docker compose down
          ```

          Do not use `docker compose down -v` unless PostgreSQL data and generated TLS keys should also be deleted.
