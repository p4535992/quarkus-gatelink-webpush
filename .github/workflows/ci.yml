name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: gatelink
          POSTGRES_USER: gatelink
          POSTGRES_PASSWORD: gatelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatelink -d gatelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test GateLink server
        run: mvn -B -f quarkus-gatelink-webpush-server/pom.xml clean verify

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Build production container images
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml
          build quarkus-gatelink-webpush-server quarkus-gatelink-webpush-ui

      - name: Prepare server data permissions
        run: |
          sudo chown -R 10001:10001 data/quarkus-gatelink-webpush-server/logs
          sudo chown -R 10001:10001 data/quarkus-gatelink-webpush-server/tmp

      - name: Smoke test production Compose stack
        run: |
          docker compose --env-file .env.example -f docker-compose.yml \
            up -d --no-build --wait --wait-timeout 120

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/)" = "308"

          curl --fail --insecure --silent --show-error https://127.0.0.1/healthz
          curl --fail --insecure --silent --show-error https://127.0.0.1/api/q/health/ready
          curl --fail --insecure --silent --show-error https://127.0.0.1/dashboard | grep -q '<app-root'

          curl --fail --silent --show-error http://127.0.0.1:8080/q/health/ready
          curl --fail --insecure --silent --show-error https://127.0.0.1:8443/q/health/ready

          test "$(docker inspect -f '{{.Name}}' quarkus-gatelink-webpush-server)" = '/quarkus-gatelink-webpush-server'
          test "$(docker inspect -f '{{.Config.Hostname}}' quarkus-gatelink-webpush-server)" = 'quarkus-gatelink-webpush-server'
          test "$(docker inspect -f '{{.Name}}' quarkus-gatelink-webpush-ui)" = '/quarkus-gatelink-webpush-ui'
          test "$(docker inspect -f '{{.Config.Hostname}}' quarkus-gatelink-webpush-ui)" = 'quarkus-gatelink-webpush-ui'

          docker compose --env-file .env.example -f docker-compose.yml \
            exec -T quarkus-gatelink-webpush-ui getent hosts quarkus-gatelink-webpush-server

          docker compose --env-file .env.example -f docker-compose.yml \
            exec -T quarkus-gatelink-webpush-server \
            sh -c 'test "$(id -u)" = "10001" && test -w /opt/app/logs && test -w /opt/app/tmp && test -s /opt/app/tls/tls.crt && test -s /opt/app/tls/tls.key'

          docker compose --env-file .env.example -f docker-compose.yml \
            exec -T quarkus-gatelink-webpush-ui \
            sh -c 'test -s /etc/nginx/tls/tls.crt && test -s /etc/nginx/tls/tls.key'

          test -f data/quarkus-gatelink-webpush-server/logs/application.log
          docker compose --env-file .env.example -f docker-compose.yml ps

      - name: Print Compose diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example -f docker-compose.yml ps -a || true
          docker compose --env-file .env.example -f docker-compose.yml logs --no-color --tail=300 || true

      - name: Stop production Compose stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml down -v --remove-orphans
